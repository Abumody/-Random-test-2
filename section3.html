<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section 3 – Listening</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f172a;
  --card:#020617;
  --accent:#38bdf8;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:#1e293b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrapper{width:92%;max-width:900px}
.audio-box{
  background:#020617;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}
.card{
  min-height:75vh;
  background:linear-gradient(180deg,#0b1220,#020617);
  border:1px solid var(--border);
  border-radius:26px;
  padding:40px;
  display:flex;
  flex-direction:column;
}
.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.section-title{
  color:var(--accent);
  font-size:22px;
  font-weight:bold;
}
.progress{
  color:var(--muted);
  font-size:14px;
}
.instructions{
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:20px;
  color:#cbd5f5;
}
.content{
  flex-grow:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.question{
  font-size:24px;
  font-weight:600;
  margin-bottom:20px;
}
.options label{
  display:block;
  padding:12px 14px;
  margin:10px 0;
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  cursor:pointer;
}
input[type=text]{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
.nav{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}
button{
  padding:12px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#020617;
  font-weight:bold;
  cursor:pointer;
}
audio{width:100%}
</style>
</head>

<body>

<div class="wrapper">

  <!-- 🔒 AUDIO FIXED -->
  <div class="audio-box">
    <audio id="audio" controls></audio>
  </div>

  <div id="app"></div>

</div>

<script>
const questions = [
{section:"Listening 1",audio:"assets/listening1.mp3",type:"mcq",q:"Lucy’s surname is",o:["More","Moor","Moore"]},
{section:"Listening 1",audio:"assets/listening1.mp3",type:"mcq",q:"She’s in class",o:["1C","1B","4B"]},
{section:"Listening 1",audio:"assets/listening1.mp3",type:"short",q:"Lucy is",hint:"Write the age"},
{section:"Listening 2",audio:"assets/listening2.mp3",type:"tf",q:"Tom doesn't know how to start studying."},
{section:"Listening 2",audio:"assets/listening2.mp3",type:"tf",q:"Tom's mum thinks that music helps people study."},
{section:"Listening 2",audio:"assets/listening2.mp3",type:"tf",q:"Tom puts the dog outside."},
{section:"Listening 2",audio:"assets/listening2.mp3",type:"tf",q:"Tom's mum recommends having a sandwich on the desk."},
{section:"Listening 2",audio:"assets/listening2.mp3",type:"tf",q:"Tom doesn't want to turn off his phone at first."}
];

let index = 0;
let answers = JSON.parse(localStorage.getItem("section3Answers") || "[]");
const audio = document.getElementById("audio");

function render(){
  const q = questions[index];

  if(!audio.src.includes(q.audio)){
    audio.src = q.audio;
  }

  let html = `
  <div class="card">
    <div class="header">
      <div class="section-title">${q.section}</div>
      <div class="progress">Question ${index+1} of ${questions.length}</div>
    </div>
    <div class="instructions">
      Listen to the audio carefully. The audio will continue playing while you move between questions.
    </div>
    <div class="content">
      <div class="question">${q.q}</div>
  `;

  if(q.type==="mcq"){
    html+=`<div class="options">`;
    q.o.forEach((x,i)=>{
      html+=`<label><input type="radio" name="a" value="${i}"> ${x}</label>`;
    });
    html+=`</div>`;
  }

  if(q.type==="short"){
    html+=`<input type="text" placeholder="${q.hint||""}">`;
  }

  if(q.type==="tf"){
    html+=`
      <div class="options">
        <label><input type="radio" name="a" value="true"> True</label>
        <label><input type="radio" name="a" value="false"> False</label>
      </div>`;
  }

  html+=`
    </div>
    <div class="nav">
      <button onclick="prev()">Back</button>
      <button onclick="next()">Next</button>
    </div>
  </div>`;

  document.getElementById("app").innerHTML = html;

  // 🔑 RESTORE ANSWERS
  const saved = answers[index];
  if(saved !== undefined && saved !== null){
    if(q.type==="mcq" || q.type==="tf"){
      document.querySelectorAll("input[name='a']").forEach(r=>{
        if(r.value == saved) r.checked = true;
      });
    }
    if(q.type==="short"){
      document.querySelector("input").value = saved;
    }
  }
}

function save(){
  const q = questions[index];
  let val = null;

  if(q.type==="mcq" || q.type==="tf"){
    const r = document.querySelector("input[name='a']:checked");
    if(r) val = r.value;
  }
  if(q.type==="short"){
    val = document.querySelector("input").value;
  }

  answers[index] = val;
  localStorage.setItem("section3Answers", JSON.stringify(answers));
}

function next(){
  save();
  index < questions.length-1 ? (index++,render()) : location.href="section4.html";
}
function prev(){
  save();
  if(index > 0){ index--; render(); }
}

render();
</script>

</body>
</html>
