<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing 1 | Grade 11</title>

<style>
:root{
  --primary:#9b59b6;
  --secondary:#3498db;
  --success:#27ae60;
  --warning:#f39c12;
  --danger:#e74c3c;
  --bg:#f5f7fa;
  --card:#ffffff;
  --soft:#f8f9fa;
}
*{box-sizing:border-box}
body{
  margin:0; padding:20px;
  font-family:'Segoe UI', Tahoma, sans-serif;
  background:var(--bg); color:#333;
}
.container{
  max-width:1100px; margin:auto;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
  overflow:hidden;
}
header{
  background:linear-gradient(135deg,var(--primary),#8e44ad);
  color:#fff; text-align:center; padding:26px;
}
.section{padding:28px}

.box{
  background:var(--soft);
  border-left:6px solid var(--primary);
  border-radius:10px;
  padding:18px;
  margin-bottom:22px;
}
textarea{
  width:100%;
  min-height:260px;
  padding:16px;
  border-radius:12px;
  border:2px solid #ddd;
  font-size:1rem;
  line-height:1.6;
}
textarea:focus{outline:none;border-color:var(--primary)}
.counter{margin-top:8px;font-size:.95rem}

.actions{
  display:flex; gap:12px; flex-wrap:wrap; margin-top:18px;
}
.btn{
  flex:1; min-width:160px;
  padding:12px 16px;
  border:none; border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s ease;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-reset{background:#95a5a6;color:#fff}
.btn-back{
  background:var(--secondary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.band-badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  color:#fff;
  font-weight:700;
}
.band-5{background:var(--success)}
.band-4{background:#2980b9}
.band-3{background:var(--warning)}
.band-2{background:#e67e22}
.band-1{background:#c0392b}

.progress-wrap{
  background:#e0e0e0;
  height:12px;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),#8e44ad);
  transition:width .5s ease;
}
.hidden{display:none}

.feedback-content{
  margin-top:20px;
  padding:20px;
  background:var(--soft);
  border-radius:12px;
  border-left:4px solid var(--primary);
}

.feedback-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin:20px 0;
}
@media (max-width:768px){
  .feedback-grid{grid-template-columns:1fr}
}

.feedback-card{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
.feedback-card h4{
  margin-top:0;
  color:var(--primary);
  border-bottom:2px solid #eee;
  padding-bottom:8px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>WRITING 1</h1>
  <p>Grade 11 • Semester One • (5 marks)</p>
</header>

<div class="section">

<div class="box">
  <h3>Task</h3>
  <p>
    Write at least <strong>85 words</strong> on the following topic:
  </p>
  <p style="text-align:center;font-weight:700;font-size:1.1rem">
    "Challenges Teenagers Face in Their Daily Lives"
  </p>
  <p><em>Your writing should be clear and organised.</em></p>
</div>

<h3>Your Writing</h3>
<textarea id="writingArea" placeholder="Start writing here...

."></textarea>
<div id="wordCounter" class="counter">Words: <strong>0</strong> / 85</div>

<div class="actions">
  <button class="btn btn-primary" onclick="getFeedback()">Get Feedback</button>
  <button class="btn btn-reset" onclick="resetAll()">Clear</button>
  <button class="btn btn-back" onclick="goBack()">← Back to Dashboard</button>
</div>

<div id="feedbackSection" class="hidden"></div>

</div>
</div>

<script>
const MIN_WORDS = 85;

/* Word Counter */
const writingArea = document.getElementById("writingArea");
const wordCounter = document.getElementById("wordCounter");

writingArea.addEventListener("input",()=>{
  const words = writingArea.value.trim().split(/\s+/).filter(w=>w).length;
  wordCounter.innerHTML = `Words: <strong>${words}</strong> / ${MIN_WORDS}`;
  wordCounter.style.color = words < MIN_WORDS ? "var(--danger)" : "var(--success)";
});

// ============================================
// FIXED: زر العودة
// ============================================
function goBack() {
  // العودة إلى صفحة الداشبورد
  window.location.href = '../dashboard.html';
}

/* Feedback */
function getFeedback(){
  const text = writingArea.value.trim();
  const words = text.split(/\s+/).filter(w=>w).length;

  if(!text){ 
    renderFeedback(1, "Please write something first."); 
    return; 
  }
  if(words < MIN_WORDS){
    alert(`Minimum ${MIN_WORDS} words required. You have ${words} words.`);
    return;
  }

  // تحليل الجودة بناءً على المحتوى
  let band = analyzeWriting(text, words);
  renderFeedback(band, text);
}

/* Analyze Writing Quality */
function analyzeWriting(text, wordCount) {
  // فحص التنظيم
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const hasParagraphs = paragraphs.length >= 2;
  
  // فحص الأفكار المتعلقة بالتحديات
  const challenges = [
    'academic', 'school', 'homework', 'exam', 'study', 'grade',
    'social media', 'instagram', 'facebook', 'online', 'internet',
    'peer pressure', 'friends', 'popular', 'fit in',
    'family', 'parent', 'expectation', 'pressure',
    'stress', 'anxiety', 'depression', 'mental',
    'time', 'manage', 'balance', 'busy',
    'identity', 'self-esteem', 'confidence', 'body image',
    'future', 'career', 'university', 'job',
    'money', 'financial', 'economic'
  ];
  
  let uniqueChallenges = 0;
  const lowerText = text.toLowerCase();
  for (const challenge of challenges) {
    if (lowerText.includes(challenge)) {
      uniqueChallenges++;
    }
  }
  
  // فحص الجمل
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
  const avgSentenceLength = wordCount / sentences.length;
  
  // تقييم النقاط
  let score = 3; // متوسط
  
  if (wordCount >= 100) score += 0.5;
  if (wordCount >= 120) score += 0.5;
  if (hasParagraphs) score += 0.5;
  if (uniqueChallenges >= 4) score += 0.5;
  if (avgSentenceLength >= 10 && avgSentenceLength <= 20) score += 0.5;
  if (uniqueChallenges >= 5) score += 0.5;
  
  // التأكد من أن النتيجة بين 1 و 5
  return Math.max(1, Math.min(5, Math.round(score)));
}

/* Render Feedback */
function renderFeedback(band, text){
  const feedbackSection = document.getElementById("feedbackSection");
  feedbackSection.classList.remove("hidden");

  const progress = band * 20;
  const titles={
    5:"Excellent",
    4:"Very Good",
    3:"Satisfactory",
    2:"Weak",
    1:"Very Weak"
  };
  
  const descriptions={
    5:"Your writing is well-organized, clear, and covers multiple relevant challenges with good supporting details.",
    4:"Good effort with clear organization and several relevant challenges. Could use more specific examples.",
    3:"Satisfactory writing with basic organization. Try to develop your ideas more fully.",
    2:"Needs improvement in organization and clarity. Focus on developing one challenge at a time.",
    1:"Very basic response. Please write more and organize your thoughts."
  };
  
  const tips={
    5:"Excellent work! You've shown deep understanding of teenage challenges.",
    4:"Good job! Try to add more personal examples or solutions to the challenges.",
    3:"Keep practicing! Work on developing each challenge with 2-3 supporting sentences.",
    2:"Start with an outline before writing. Organize different challenges into clear paragraphs.",
    1:"Begin by listing 3-4 challenges teenagers face, then write about each one."
  };

  feedbackSection.innerHTML=`
    <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
      <span class="band-badge band-${band}" style="font-size:1.1rem;">
        Mark ${band} / 5 – ${titles[band]}
      </span>
      <div style="flex:1;">
        <div class="progress-wrap">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
      </div>
    </div>
    
    <div class="feedback-content">
      <h3 style="margin-top:0; color:var(--primary);">Feedback</h3>
      
      <div class="feedback-grid">
        <div class="feedback-card">
          <h4>✅ What's Good</h4>
          <p>${descriptions[band]}</p>
          <ul>
            ${band >= 3 ? '<li>You addressed the topic</li>' : ''}
            ${band >= 4 ? '<li>Good use of vocabulary</li>' : ''}
            ${band >= 5 ? '<li>Excellent organization and flow</li>' : ''}
          </ul>
        </div>
        
        <div class="feedback-card">
          <h4>🎯 How to Improve</h4>
          <p>${tips[band]}</p>
          <ul>
            ${band <= 3 ? '<li>Write longer paragraphs with more details</li>' : ''}
            ${band <= 4 ? '<li>Add specific examples and explanations</li>' : ''}
            ${band <= 2 ? '<li>Start with a clear introduction and conclusion</li>' : ''}
          </ul>
        </div>
      </div>
      
      <div style="margin-top:20px; padding:15px; background:#e8f6f3; border-radius:8px; border-left:4px solid var(--success);">
        <h4 style="margin-top:0; color:var(--success);">📝 Writing Tips</h4>
        <p><strong>For better scores:</strong></p>
        <ol>
          <li>Start with an introduction about teenage challenges</li>
          <li>Discuss 3-4 specific challenges with examples</li>
          <li>Explain how each challenge affects teenagers</li>
          <li>Suggest possible solutions or coping strategies</li>
          <li>End with a conclusion summarizing the main points</li>
          <li>Aim for 100+ words with clear paragraph structure</li>
        </ol>
      </div>
      
      <div style="margin-top:20px; text-align:center;">
        <button class="btn btn-primary" onclick="resetAll()" style="min-width:200px;">Try Again</button>
        <button class="btn btn-back" onclick="goBack()" style="min-width:200px; margin-left:10px;">Back to Dashboard</button>
      </div>
    </div>
  `;
}

function resetAll(){
  writingArea.value="";
  wordCounter.innerHTML="Words: <strong>0</strong> / 85";
  document.getElementById("feedbackSection").classList.add("hidden");
}

// Load student name from URL if available
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const studentName = urlParams.get('student');
  
  if (studentName) {
    // يمكنك استخدام اسم الطالب هنا إذا أردت
    console.log(`Student: ${studentName}`);
  }
});
</script>

</body>
</html>
